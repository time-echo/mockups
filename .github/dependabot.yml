version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      prefix-development: chore
    groups:
      storybook:
        patterns: ["storybook", "@storybook/*"]
      dev-dependencies:
        dependency-type: development
        exclude-patterns: ["storybook", "@storybook/*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
