name: PR Size

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  size-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const ignored = [/^pnpm-lock\.yaml$/, /^storybook-static\//];
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const changed = files
              .filter((f) => !ignored.some((re) => re.test(f.filename)))
              .reduce((sum, f) => sum + f.additions + f.deletions, 0);

            const sizes = [
              ['size/XS', 10],
              ['size/S', 100],
              ['size/M', 300],
              ['size/L', 800],
            ];
            const label = (sizes.find(([, max]) => changed <= max) ?? ['size/XL'])[0];

            const current = (
              await github.paginate(github.rest.issues.listLabelsOnIssue, {
                ...context.repo,
                issue_number: context.issue.number,
              })
            ).map((l) => l.name);

            for (const name of current.filter((n) => n.startsWith('size/') && n !== label)) {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: context.issue.number,
                name,
              });
            }
            if (!current.includes(label)) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: context.issue.number,
                labels: [label],
              });
            }
            core.info(`${changed} changed lines -> ${label}`);
